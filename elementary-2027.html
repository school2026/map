var KEY='elem2027-placement';
var orig={}; 학생.forEach(function(s){orig[s.id]=s.pl;});
try{ var saved=JSON.parse(localStorage.getItem(KEY)||'{}');
  학생.forEach(function(s){ if(Object.prototype.hasOwnProperty.call(saved,s.id)) s.pl=saved[s.id]; }); }catch(e){}
function save(){ var d={}; 학생.forEach(function(s){ if(s.pl!==orig[s.id]) d[s.id]=s.pl; });
  try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }

var byName={}; 학교.forEach(function(s){byName[s.name]=s;});
var schoolNames=학교.map(function(s){return s.name;}).sort(function(a,b){return a.localeCompare(b,'ko');});

function nm(n){ if(이름표시==='full'||n.length<2) return n;
  if(n.length===2) return n[0]+'○'; return n[0]+'○'.repeat(n.length-2)+n[n.length-1]; }
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function calc(sch){
  var list=학생.filter(function(s){return s.pl===sch.name;});
  var q=sch.cls*6, e=sch.cur-sch.grad+list.length, st='none';
  if(e>q) st='over'; else if(e===q) st='full'; else if(e<=6*(sch.cls-1) && !(sch.newcls&&e===0)) st='cut';
  return {list:list,q:q,e:e,st:st};
}
var stTxt={none:'여석',full:'충족',cut:'감축',over:'과원'};
function stDetail(r){ if(r.st==='over') return (r.e-r.q)+'명 과원'; if(r.st==='full') return '정원 충족';
  if(r.st==='cut') return '감축 대상'; return (r.q-r.e)+'명 여석'; }

var map, ovs={}, filter='all', focus=null, region='';
function inRegion(sch){ if(!region) return true; var p=region.split(':');
  return p[0]==='gu' ? sch.gu===p[1] : (sch.zone||[]).indexOf(p[1])>=0; }

function labelHtml(sch,r){
  var names=r.list.length? '<div class="mk-st">'+r.list.length+'명: '+r.list.map(function(s){return esc(nm(s.name));}).join(', ')+'</div>':'';
  return '<div class="mk-nm">'+sch.name+'</div><div class="mk-cnt">'+r.e+'명</div>'
    +'<div class="mk-cap">'+(sch.newcls?'특수학급 신설 희망 · 정원 '+r.q+'명':sch.cls+'학급 · 정원 '+r.q+'명')+'</div>'+names;
}

function renderMap(){
  var cnt={none:0,full:0,cut:0,over:0};
  학교.forEach(function(sch){
    var r=calc(sch); if(inRegion(sch)) cnt[r.st]++;
    var o=ovs[sch.name];
    o.el.className='mk st-'+r.st+(focus===sch.name?' sel':'');
    o.el.innerHTML=labelHtml(sch,r);
    var show = inRegion(sch) && (filter==='all' || (filter==='has'&&r.list.length>0) || (filter==='over'&&r.st==='over'));
    o.ov.setMap(show?map:null);
  });
  var pl=학생.filter(function(s){return s.pl;}).length;
  document.getElementById('sStu').textContent=학생.length+'명';
  document.getElementById('sPl').textContent=pl+'명';
  document.getElementById('sUn').textContent=(학생.length-pl)+'명';
  document.getElementById('sOK').textContent=cnt.none+'곳';
  document.getElementById('sCut').textContent=cnt.cut+'곳';
  document.getElementById('sFull').textContent=cnt.full+'곳';
  document.getElementById('sOver').textContent=cnt.over+'곳';
}

function optHtml(sel){
  var h='<option value=""'+(sel?'':' selected')+'>미정</option>';
  schoolNames.forEach(function(n){ h+='<option'+(n===sel?' selected':'')+'>'+n+'</option>'; });
  return h;
}
function resHtml(s){
  if(!s.pl) return '';
  var r=calc(byName[s.pl]);
  return '<span class="st-res c-'+r.st+'">'+r.e+'/'+r.q+' '+stTxt[r.st]+'</span>';
}

function renderList(){
  var q=document.getElementById('q').value.trim(), v=document.getElementById('view').value;
  var items=학생.filter(function(s){
    if(focus && s.pl!==focus) return false;
    if(v==='un'&&s.pl) return false;
    if(v==='pl'&&!s.pl) return false;
    if(v==='chg'&&s.pl===orig[s.id]) return false;
    if(q){ var hay=[s.name,s.from,s.near,s.pl,s.note].concat(s.h).join(' ');
      if(hay.indexOf(q)<0) return false; }
    return true;
  });
  document.getElementById('pCount').textContent=items.length+'명 표시';
  var box=document.getElementById('list');
  if(!items.length){ box.innerHTML='<div class="empty">조건에 맞는 학생이 없어요. 검색어나 보기 조건을 바꿔 보세요.</div>'; return; }
  box.innerHTML=items.map(function(s){
    var chg=s.pl!==orig[s.id];
    var hopes=s.h.filter(Boolean).map(function(h,i){ return (i+1)+'희망 '+(byName[h]?'<span class="hl">'+esc(h)+'</span>':esc(h)); }).join(' / ');
    return '<div class="st'+(chg?' chg':'')+'" data-id="'+s.id+'">'
      +'<div class="st-top"><span class="st-nm">'+esc(nm(s.name))+(chg?'<span class="badge">변경</span>':'')+'</span><span class="st-from">'+esc(s.from)+'</span></div>'
      +'<div class="st-meta">'+(hopes||'희망교 없음')+'<br>학구초/최근거리 '+esc(s.near||'-')+(chg?' · 원래 '+esc(orig[s.id]||'미정'):'')+'</div>'
      +(s.note?'<div class="st-note">'+esc(s.note)+'</div>':'')
      +'<div class="st-pick"><select aria-label="'+esc(nm(s.name))+' 가배치교">'+optHtml(s.pl)+'</select>'+resHtml(s)+'</div>'
      +'</div>';
  }).join('');
}

function renderFocus(){
  var b=document.getElementById('pSch');
  if(!focus){ b.style.display='none'; return; }
  var r=calc(byName[focus]);
  b.style.display='flex';
  document.getElementById('pSchName').textContent=focus;
  document.getElementById('pSchInfo').textContent='예상 '+r.e+'/'+r.q+'명 · '+stDetail(r);
}
function refresh(){ renderMap(); renderList(); renderFocus(); }

document.getElementById('list').addEventListener('change',function(e){
  if(e.target.tagName!=='SELECT') return;
  var id=+e.target.closest('.st').dataset.id;
  학생.forEach(function(s){ if(s.id===id) s.pl=e.target.value; });
  save(); refresh();
});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('view').addEventListener('change',renderList);
document.getElementById('pSchClear').addEventListener('click',function(){ focus=null; refresh(); });
document.querySelectorAll('.filters .btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.filters .btn').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); filter=b.dataset.f; renderMap();
  });
});
document.getElementById('region').addEventListener('change',function(){
  region=this.value;
  document.getElementById('regionTag').textContent=region?region.split(':')[1]+' · ':'';
  renderMap();
  if(!map) return;
  if(!region){ map.setCenter(new kakao.maps.LatLng(37.272,127.010)); map.setLevel(7); return; }
  var b=new kakao.maps.LatLngBounds(), n=0;
  학교.forEach(function(sch){ if(inRegion(sch)){ b.extend(new kakao.maps.LatLng(sch.lat,sch.lng)); n++; } });
  if(n) map.setBounds(b,80,80,80,80);
});
document.getElementById('btnPanel').addEventListener('click',function(){
  var p=document.getElementById('panel'), open=p.classList.toggle('hide')===false;
  document.body.classList.toggle('panel-open',open);
  this.textContent=open?'학생 목록 닫기':'학생 목록 열기';
});
document.getElementById('btnReset').addEventListener('click',function(){
  var n=학생.filter(function(s){return s.pl!==orig[s.id];}).length;
  if(!n){ alert('변경한 학생이 없어요.'); return; }
  if(!confirm('변경한 '+n+'명의 가배치교를 파일에 저장된 원래 값으로 되돌릴까요?')) return;
  학생.forEach(function(s){ s.pl=orig[s.id]; });
  try{ localStorage.removeItem(KEY); }catch(e){}
  refresh();
});
document.getElementById('btnCsv').addEventListener('click',function(){
  var rows=[['순번','소속교','이름','1희망','2희망','3희망','학구초/최근거리','가배치교','원래 가배치교','비고']];
  학생.forEach(function(s){ rows.push([s.id,s.from,s.name,s.h[0],s.h[1],s.h[2],s.near,s.pl,orig[s.id],s.note]); });
  var csv='\ufeff'+rows.map(function(r){return r.map(function(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='2027_초등_가배치결과.csv'; document.body.appendChild(a); a.click(); a.remove();
});

kakao.maps.load(function(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.272,127.010),level:7});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.BOTTOMRIGHT);
  학교.forEach(function(sch){
    var el=document.createElement('div');
    el.addEventListener('click',function(){
      focus=(focus===sch.name)?null:sch.name;
      var p=document.getElementById('panel');
      if(focus&&p.classList.contains('hide')) document.getElementById('btnPanel').click();
      document.getElementById('view').value='all';
      refresh();
    });
    var ov=new kakao.maps.CustomOverlay({content:el,position:new kakao.maps.LatLng(sch.lat,sch.lng),yAnchor:.5,xAnchor:.5,zIndex:2,clickable:true});
    ovs[sch.name]={el:el,ov:ov};
  });
  refresh();
});
</script>
