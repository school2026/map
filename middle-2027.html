// ═══════════════════════════════════════════════════════════

// 각 학급 타입별 정원·감축 판정
function statusFor(expected, cls, perClass){
  if(cls === 0) return {st:'none', quota:0};
  var quota = cls * perClass;
  if(expected > quota) return {st:'over', quota:quota};
  if(expected === quota) return {st:'full', quota:quota};
  // 감축: 1학급이면 예상 0명일 때, 2학급 이상이면 (n-1)학급 정원 이하일 때
  if(expected <= perClass * (cls - 1)) return {st:'cut', quota:quota};
  return {st:'none', quota:quota};
}

kakao.maps.load(function(){
  var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.272, 127.010),
    level: 7
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.BOTTOMRIGHT);

  var cntOK=0, cntFull=0, cntOver=0, cntCut=0;
  중학교.forEach(function(s){
    var special = statusFor(s.se, s.sc, 6);
    var itiner = statusFor(s.ie, s.ic, 4);
    var complx = statusFor(s.ce, s.cc, 4);
    var status = special.st;
    var quota = special.quota;

    if(status === 'over') cntOver++;
    else if(status === 'full') cntFull++;
    else if(status === 'cut') cntCut++;
    else cntOK++;

    var extras = [];
    if(s.ic > 0) extras.push('<span class="st-' + itiner.st + '">순회 ' + s.ie + '/' + itiner.quota + '</span>');
    if(s.cc > 0) extras.push('<span class="st-' + complx.st + '">복합 ' + s.ce + '/' + complx.quota + '</span>');
    var extraHtml = extras.length ? '<div class="mk-extra">' + extras.join(' · ') + '</div>' : '';

    var noteHtml = s.note ? '<div class="mk-note">' + s.note + '</div>' : '';

    var html = '<div class="mk-label st-' + status + '">'
      + '<div class="mk-nm">' + s.name + '</div>'
      + '<div class="mk-cnt">' + s.se + '명</div>'
      + '<div class="mk-cap">정원 ' + quota + '명</div>'
      + extraHtml
      + noteHtml
      + '</div>';

    var ov = new kakao.maps.CustomOverlay({
      content: html,
      position: new kakao.maps.LatLng(s.lat, s.lng),
      yAnchor: 0.5,
      xAnchor: 0.5,
      zIndex: 2
    });
    ov.setMap(map);
  });

  document.getElementById('sumTotal').textContent = 중학교.length + '곳';
  document.getElementById('sumOK').textContent = cntOK + '곳';
  document.getElementById('sumCut').textContent = cntCut + '곳';
  document.getElementById('sumFull').textContent = cntFull + '곳';
  document.getElementById('sumOver').textContent = cntOver + '곳';
});
</script>
