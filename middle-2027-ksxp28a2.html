  {"id":118,"name":"김진","from_":"수원제일중학교(특수학급)","pl":"명인중","t":"s","fromMid":"수원제일중"}
];
// ═══════════════════════════════════════════════════════════
var KEY='mid2027-placement', TN={s:'특수학급',i:'순회학급',c:'복합특수학급'}, PER={s:6,i:4,c:4};
var orig={}; 학생.forEach(function(s){orig[s.id]=s.pl+'|'+s.t;});
function cur(s){return s.pl?s.pl+'|'+s.t:'';}
try{var sv=JSON.parse(localStorage.getItem(KEY)||'{}');학생.forEach(function(s){if(sv[s.id]!==undefined){var p=sv[s.id].split('|');s.pl=p[0]||'';s.t=p[1]||s.t;}});}catch(e){}
function save(){var d={};학생.forEach(function(s){if(cur(s)!==orig[s.id])d[s.id]=cur(s);});try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
var byName={};학교.forEach(function(s){byName[s.name]=s;});
var opts=[];학교.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ko');}).forEach(function(s){
  opts.push([s.name+'|s',s.name]); if(s.ic)opts.push([s.name+'|i',s.name+' 순회학급']); if(s.cc)opts.push([s.name+'|c',s.name+' 복합특수학급']);});
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function judge(e,n,per){if(!n)return 'none';var q=n*per;if(e>q)return 'over';if(e===q)return 'full';if(e<=per*(n-1))return 'cut';return 'none';}
function calc(sch){
  var r={};
  ['s','i','c'].forEach(function(t){
    var n=t==='s'?sch.sc:t==='i'?sch.ic:sch.cc, c0=t==='s'?sch.scur:t==='i'?sch.icur:sch.ccur, g=t==='s'?sch.sgrad:t==='i'?sch.igrad:sch.cgrad;
    var list=학생.filter(function(x){return x.pl===sch.name&&x.t===t&&x.fromMid!==sch.name;});
    var out=t==='s'?학생.filter(function(x){return x.fromMid===sch.name&&!(x.pl===sch.name&&x.t==='s');}).length:0;
    var e=c0-g+list.length-out;
    r[t]={list:list,e:e,q:n*PER[t],n:n,st:judge(e,n,PER[t])};
  });
  return r;
}
var stTxt={none:'여석',full:'충족',cut:'감축',over:'과원'};
function stDetail(x){if(x.st==='over')return (x.e-x.q)+'명 과원';if(x.st==='full')return '정원 충족';if(x.st==='cut')return '감축 대상';return (x.q-x.e)+'명 여석';}
var map,ovs={},filter='all',focus=null,region='';
function inRegion(s){return !region||(s.zone||[]).indexOf(region)>=0;}
function names(l){return l.map(function(x){return esc(x.name);}).join(', ');}
function labelHtml(sch,r){
  var h='<div class="mk-nm">'+sch.name+'</div><div class="mk-cnt">'+r.s.e+'명</div>'
    +'<div class="mk-cap">'+(sch.newcls?'특수학급 신설 예정 · 정원 '+r.s.q+'명':sch.sc+'학급 · 정원 '+r.s.q+'명')+'</div>';
  if(sch.ic) h+='<div class="mk-ex"><span class="t-'+r.i.st+'">순회 '+r.i.e+'/'+r.i.q+'</span></div>';
  if(sch.cc) h+='<div class="mk-ex"><span class="t-'+r.c.st+'">복합 '+r.c.e+'/'+r.c.q+'</span></div>';
  var lines=[];
  if(r.s.list.length) lines.push(r.s.list.length+'명: '+names(r.s.list));
  if(r.i.list.length) lines.push('순회 '+r.i.list.length+'명: '+names(r.i.list));
  if(r.c.list.length) lines.push('복합 '+r.c.list.length+'명: '+names(r.c.list));
  if(lines.length) h+='<div class="mk-st">'+lines.join('<br>')+'</div>';
  if(sch.note&&!sch.newcls) h+='<div class="mk-note">'+esc(sch.note)+'</div>';
  return h;
}
function renderMap(){
  if(!map)return;
  var cnt={none:0,full:0,cut:0,over:0};
  학교.forEach(function(sch){
    var r=calc(sch),o=ovs[sch.name],inr=inRegion(sch);
    if(inr)cnt[r.s.st]++;
    o.el.className='mk st-'+r.s.st+(focus===sch.name?' sel':'');
    o.el.innerHTML=labelHtml(sch,r);
    var has=r.s.list.length+r.i.list.length+r.c.list.length>0;
    var show=inr&&(filter==='all'||(filter==='has'&&has)||(filter==='over'&&r.s.st==='over'));
    o.ov.setMap(show?map:null);
  });
  ['OK','Cut','Full','Over'].forEach(function(k,i){document.getElementById('s'+k).textContent=cnt[['none','cut','full','over'][i]]+'곳';});
}
function renderSummary(){var pl=학생.filter(function(s){return s.pl;}).length;
  document.getElementById('sStu').textContent=학생.length+'명';document.getElementById('sPl').textContent=pl+'명';document.getElementById('sUn').textContent=(학생.length-pl)+'명';}
function optHtml(v){var h='<option value=""'+(v?'':' selected')+'>미정</option>';opts.forEach(function(o){h+='<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>';});return h;}
function resHtml(s){if(!s.pl)return '';var x=calc(byName[s.pl])[s.t];return '<span class="st-res c-'+x.st+'">'+x.e+'/'+x.q+' '+stTxt[x.st]+'</span>';}
function origTxt(id){var p=orig[id].split('|');return p[0]?p[0]+(p[1]!=='s'?' '+TN[p[1]]:''):'미정';}
function renderList(){
  var q=document.getElementById('q').value.trim(),v=document.getElementById('view').value;
  var items=학생.filter(function(s){
    if(focus&&s.pl!==focus)return false;
    if(v==='un'&&s.pl)return false;
    if(v==='chg'&&cur(s)===orig[s.id])return false;
    if(q&&[s.name,s.from_,s.pl,s.fromMid||''].join(' ').indexOf(q)<0)return false;
    return true;});
  document.getElementById('pCount').textContent=items.length+'명 표시';
  var box=document.getElementById('list');
  if(!items.length){box.innerHTML='<div class="empty">조건에 맞는 학생이 없어요. 검색어나 보기 조건을 바꿔 보세요.</div>';return;}
  box.innerHTML=items.map(function(s){var chg=cur(s)!==orig[s.id];
    return '<div class="st'+(chg?' chg':'')+'" data-id="'+s.id+'"><div class="st-top"><span class="st-nm">'+esc(s.name)
      +(s.fromMid?'<span class="badge re">재배치</span>':'')+(chg?'<span class="badge">변경</span>':'')+'</span><span class="st-from">'+esc(s.from_)+'</span></div>'
      +(chg?'<div class="st-meta">원래 '+esc(origTxt(s.id))+'</div>':'')
      +'<div class="st-pick"><select aria-label="'+esc(s.name)+' 배치교">'+optHtml(cur(s))+'</select>'+resHtml(s)+'</div></div>';}).join('');
}
function renderFocus(){var b=document.getElementById('pSch');if(!focus){b.style.display='none';return;}
  var x=calc(byName[focus]).s;b.style.display='flex';document.getElementById('pSchName').textContent=focus;
  document.getElementById('pSchInfo').textContent='특수학급 '+x.e+'/'+x.q+'명 · '+stDetail(x);}
function refresh(){renderMap();renderSummary();renderList();renderFocus();}
document.getElementById('list').addEventListener('change',function(e){if(e.target.tagName!=='SELECT')return;
  var id=+e.target.closest('.st').dataset.id,p=e.target.value.split('|');
  학생.forEach(function(s){if(s.id===id){s.pl=p[0]||'';if(p[1])s.t=p[1];}});save();refresh();});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('view').addEventListener('change',renderList);
document.getElementById('pSchClear').addEventListener('click',function(){focus=null;refresh();});
document.querySelectorAll('.filters .btn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.filters .btn').forEach(function(x){x.classList.remove('on');});b.classList.add('on');filter=b.dataset.f;renderMap();});});
document.getElementById('region').addEventListener('change',function(){region=this.value;
  document.getElementById('regionTag').textContent=region?region+' · ':'';renderMap();if(!map)return;
  if(!region){map.setCenter(new kakao.maps.LatLng(37.272,127.010));map.setLevel(7);return;}
  var b=new kakao.maps.LatLngBounds(),n=0;학교.forEach(function(s){if(inRegion(s)){b.extend(ovs[s.name].ov.getPosition());n++;}});if(n)map.setBounds(b,80,80,80,80);});
document.getElementById('btnPanel').addEventListener('click',function(){var p=document.getElementById('panel'),open=p.classList.toggle('hide')===false;
  document.body.classList.toggle('panel-open',open);this.textContent=open?'학생 목록 닫기':'학생 목록 열기';});
document.getElementById('btnReset').addEventListener('click',function(){var n=학생.filter(function(s){return cur(s)!==orig[s.id];}).length;
  if(!n){alert('변경한 학생이 없어요.');return;}if(!confirm('변경한 '+n+'명의 배치교를 파일에 저장된 원래 값으로 되돌릴까요?'))return;
  학생.forEach(function(s){var p=orig[s.id].split('|');s.pl=p[0];s.t=p[1];});try{localStorage.removeItem(KEY);}catch(e){}refresh();});
document.getElementById('btnCsv').addEventListener('click',function(){
  var rows=[['순번','출신 초등학교','이름','배치교','배치유형','원래 배치','재배치 전 학교']];
  학생.forEach(function(s){rows.push([s.id,s.from_,s.name,s.pl,s.pl?TN[s.t]:'',origTxt(s.id),s.fromMid||'']);});
  var csv='\ufeff'+rows.map(function(r){return r.map(function(x){x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='2027_중학교_배치결과.csv';document.body.appendChild(a);a.click();a.remove();});
kakao.maps.load(function(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(37.272,127.010),level:7});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.BOTTOMRIGHT);
  학교.forEach(function(sch){
    var el=document.createElement('div');
    el.addEventListener('click',function(){focus=(focus===sch.name)?null:sch.name;
      if(focus&&document.getElementById('panel').classList.contains('hide'))document.getElementById('btnPanel').click();
      document.getElementById('view').value='all';refresh();});
    var ov=new kakao.maps.CustomOverlay({content:el,position:new kakao.maps.LatLng(sch.lat,sch.lng),yAnchor:.5,xAnchor:.5,zIndex:2,clickable:true});
    ovs[sch.name]={el:el,ov:ov};
    if(sch.addr&&kakao.maps.services){new kakao.maps.services.Geocoder().addressSearch(sch.addr,function(r,st){
      if(st===kakao.maps.services.Status.OK&&r.length)ov.setPosition(new kakao.maps.LatLng(r[0].y,r[0].x));});}
  });
  refresh();
});
renderSummary();renderList();
</script>
